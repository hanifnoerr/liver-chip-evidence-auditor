<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830" role="img" aria-labelledby="title desc">
<title id="title">Liver-chip evidence auditing with a compact action model</title>
<desc id="desc">Full supervised adaptation learns an action class from authored policy examples. At inference the numerical auditor supplies a compact evidence summary to SmolLM2, eligibility checks constrain the raw action, and Python copies source-specific cards. Original measurements and source citations bypass the language model.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#334f59"/></marker><marker id="weight" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#a76525"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#203c45}.title{font-size:27px;font-weight:700}.heading{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.flow{fill:none;stroke:#334f59;stroke-width:2.5;marker-end:url(#arrow)}.weights{fill:none;stroke:#a76525;stroke-width:2.5;stroke-dasharray:8 5;marker-end:url(#weight)}</style>
<rect width="1400" height="830" fill="#fff"/>
<text x="40" y="43" class="title">An action class is learned; numerical evidence stays in Python</text>
<rect x="25" y="68" width="1350" height="235" rx="12" fill="#fbf7ef" stroke="#dfceb9"/>
<text x="45" y="100" class="heading">Supervised adaptation</text>
<rect x="45" y="120" width="340" height="156" rx="8" fill="#fff" stroke="#bfab91"/>
<text x="65" y="151" class="heading">Synthetic training data</text>
<text x="65" y="182" class="body">96 experiments; 728 requests</text>
<text x="65" y="212" class="body">Audit summary + goal + resources</text>
<text x="65" y="242" class="body">Targets from a heuristic policy</text>
<path d="M385 199H430" class="flow"/>
<rect x="435" y="120" width="440" height="156" rx="8" fill="#f5e6ce" stroke="#b78340"/>
<text x="455" y="151" class="heading">SmolLM2-135M-Instruct</text>
<text x="455" y="182" class="body">Full adaptation; 134,515,008 parameters</text>
<text x="455" y="212" class="body">Loss on assistant action code + EOS</text>
<text x="455" y="242" class="body">3 epochs; batch 8; learning rate 0.00005</text>
<path d="M875 199H920" class="flow"/>
<rect x="925" y="120" width="430" height="156" rx="8" fill="#fff" stroke="#bfab91"/>
<text x="945" y="151" class="heading">Validation selects the checkpoint</text>
<text x="945" y="182" class="body">24 experiments; 182 requests</text>
<text x="945" y="212" class="body">Lowest assistant-token loss: epoch 2</text>
<text x="945" y="242" class="body">Test / published cases excluded</text>
<path d="M1140 276V326H660V435" class="weights"/>
<text x="746" y="319" class="small" fill="#a76525">Selected adapted weights</text>
<text x="40" y="365" class="heading">Local inference</text>
<text x="400" y="397" class="body">Request + resource limits</text>
<path d="M500 404V435" class="flow"/>
<rect x="40" y="440" width="290" height="202" rx="8" fill="#eef5f3" stroke="#8ba99f"/>
<text x="60" y="474" class="heading">Numerical auditor</text>
<text x="60" y="507" class="body">Source checks; isotonic fit</text>
<text x="60" y="538" class="body">Curve / deletion / missing</text>
<text x="60" y="565" class="body">sensitivity calculations</text>
<text x="60" y="603" class="small">Summary + allowed action codes</text>
<path d="M330 538H375" class="flow"/>
<rect x="380" y="440" width="300" height="202" rx="8" fill="#f5e6ce" stroke="#b78340"/>
<text x="400" y="474" class="heading">Adapted language model</text>
<text x="400" y="507" class="body">Score 8 action-code choices</text>
<text x="400" y="538" class="body">Mean token log likelihood</text>
<text x="400" y="575" class="body">Return highest-scoring code</text>
<text x="400" y="603" class="small">No generated doses or citations</text>
<path d="M680 538H725" class="flow"/>
<text x="687" y="518" class="small">Raw</text>
<rect x="730" y="440" width="290" height="202" rx="8" fill="#eef5f3" stroke="#8ba99f"/>
<text x="750" y="474" class="heading">Eligibility and scope</text>
<text x="750" y="507" class="body">Check blocked input, request</text>
<text x="750" y="538" class="body">and available resources</text>
<text x="750" y="575" class="body">Rules fallback when forbidden</text>
<text x="750" y="603" class="small">Export raw and delivered choices</text>
<path d="M1020 538H1065" class="flow"/>
<rect x="1070" y="440" width="290" height="202" rx="8" fill="#eef5f3" stroke="#8ba99f"/>
<text x="1090" y="474" class="heading">Python action renderer</text>
<text x="1090" y="507" class="body">Copy first relevant source card</text>
<text x="1090" y="538" class="body">Copy measured values and</text>
<text x="1090" y="565" class="body">source / scenario references</text>
<text x="1090" y="603" class="small">Source-specific next step + export</text>
<path d="M185 642V691H1215V642" class="flow"/>
<rect x="343" y="674" width="726" height="32" fill="#fff"/>
<text x="355" y="697" class="body">Original source cards and numerical text bypass the language model</text>
<line x1="40" y1="739" x2="1360" y2="739" stroke="#ccd9d4"/>
<text x="40" y="769" class="body">Quality evaluation: 364 authored test requests from 48 held-out experiments; 42 published demonstrations.</text>
<text x="40" y="803" class="body">Policy agreement is not biological validation. CPU inference is measured on a PC; edge hardware is untested.</text>
</svg>
